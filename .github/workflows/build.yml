name: Build apps

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest        # Apple Silicon (M1/M2/M3/M4)
            name: AdSplicer-mac-apple-silicon
          - os: macos-15-intel      # older Intel Macs
            name: AdSplicer-mac-intel
          - os: windows-latest
            name: AdSplicer-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install -r requirements-dev.txt

      - name: Download FFmpeg to bundle
        run: python scripts/fetch_ffmpeg.py vendor/ffmpeg

      - name: Check FFmpeg can draw captions (libass)
        shell: bash
        run: |
          vendor/ffmpeg/ffmpeg -hide_banner -filters | grep -E " subtitles "

      - name: Run tests with the bundled FFmpeg (+ real Whisper on macOS)
        shell: bash
        env:
          AD_SPLICER_WHISPER_TEST: "1"
        run: |
          export PATH="$PWD/vendor/ffmpeg:$PATH"
          ffmpeg -version | head -1
          python -m pytest -q -rs

      - name: Build app (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --windowed --name "Ad Splicer" \
            --add-binary "vendor/ffmpeg/ffmpeg:ffmpeg" \
            --add-binary "vendor/ffmpeg/ffprobe:ffmpeg" \
            --add-data "ad_splicer/fonts:ad_splicer/fonts" \
            --collect-all faster_whisper --collect-all ctranslate2 --collect-all onnxruntime \
            --collect-data tokenizers \
            run_app.py
          python scripts/smoke_test_app.py "dist/Ad Splicer.app/Contents/MacOS/Ad Splicer" vendor/ffmpeg "$RUNNER_TEMP/smoke"
          cd dist && ditto -c -k --keepParent "Ad Splicer.app" "../${{ matrix.name }}.zip"

      - name: Build app (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pyinstaller --noconfirm --windowed --name "Ad Splicer" \
            --add-binary "vendor/ffmpeg/ffmpeg.exe;ffmpeg" \
            --add-binary "vendor/ffmpeg/ffprobe.exe;ffmpeg" \
            --add-data "ad_splicer/fonts;ad_splicer/fonts" \
            --collect-all faster_whisper --collect-all ctranslate2 --collect-all onnxruntime \
            --collect-data tokenizers \
            run_app.py
          python scripts/smoke_test_app.py "dist/Ad Splicer/Ad Splicer.exe" vendor/ffmpeg "$RUNNER_TEMP/smoke"
          cd dist && 7z a "../${{ matrix.name }}.zip" "Ad Splicer"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.zip

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.name }}.zip
